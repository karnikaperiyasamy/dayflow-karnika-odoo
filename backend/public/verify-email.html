<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayflow — Verify Email</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="top">
    <span class="brand">Dayflow</span>
    <span class="tagline">Every workday, perfectly aligned.</span>
  </div>
  <main>
    <div class="card">
      <h1>Email verification</h1>
      <p class="sub" id="statusText">Checking your verification link…</p>
      <div class="msg" id="msg"></div>
      <a href="/login.html"><button type="button">Go to login</button></a>
    </div>
  </main>
  <script src="/api.js"></script>
  <script>
    const msg = document.getElementById('msg');
    const statusText = document.getElementById('statusText');

    (async () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        statusText.textContent = 'No verification token provided.';
        showMsg(msg, 'This link is missing a verification token.', 'error');
        return;
      }

      const { ok, data } = await api('/api/auth/verify-email?token=' + encodeURIComponent(token), {
        method: 'GET',
      });

      if (ok) {
        statusText.textContent = 'Verification complete.';
        showMsg(msg, data.message, 'ok');
      } else {
        statusText.textContent = 'Verification failed.';
        showMsg(msg, data?.error || 'Could not verify this account.', 'error');
      }
    })();
  </script>
</body>
</html>
