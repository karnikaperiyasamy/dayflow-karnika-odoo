<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayflow — Register</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="top">
    <span class="brand">Dayflow</span>
    <span class="tagline">Every workday, perfectly aligned.</span>
  </div>
  <main>
    <div class="card wide">
      <h1>Create your account</h1>
      <p class="sub">Register for Dayflow HR access.</p>
      <form id="registerForm">
        <label for="employeeId">Employee ID</label>
        <input type="text" id="employeeId" required>

        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="new-password">

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password">

        <label for="role">Role</label>
        <select id="role" required>
          <option value="" disabled selected>Select a role</option>
          <option value="EMPLOYEE">Employee</option>
          <option value="HR">HR</option>
          <option value="ADMIN">Admin</option>
        </select>

        <button type="submit" id="submitBtn">Register</button>
      </form>
      <div class="msg" id="msg"></div>
      <div class="dev-box" id="devBox" style="display:none;"></div>
      <p class="foot-link">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </main>
  <script src="/api.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');
    const devBox = document.getElementById('devBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      msg.style.display = 'none';
      devBox.style.display = 'none';

      const payload = {
        employeeId: document.getElementById('employeeId').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        confirmPassword: document.getElementById('confirmPassword').value,
        role: document.getElementById('role').value,
      };

      const { ok, data } = await api('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify(payload),
      });

      if (ok) {
        showMsg(msg, data.message, 'ok');
        devBox.style.display = 'block';
        devBox.innerHTML = `<strong>Dev mode:</strong> ${data.devNote}<br>
          <a href="${data.verificationLink}">Click here to verify this account</a>`;
        form.reset();
      } else {
        showMsg(msg, data?.error || 'Registration failed.', 'error');
      }
      submitBtn.disabled = false;
    });
  </script>
</body>
</html>
