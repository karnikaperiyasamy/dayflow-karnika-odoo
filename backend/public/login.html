<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayflow — Sign In</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="top">
    <span class="brand">Dayflow</span>
    <span class="tagline">Every workday, perfectly aligned.</span>
  </div>
  <main>
    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Access your Dayflow workspace.</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit" id="submitBtn">Login</button>
      </form>
      <div class="msg" id="msg"></div>
      <p class="foot-link">Don't have an account? <a href="/register.html">Register</a></p>
    </div>
  </main>
  <script src="/api.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      msg.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { ok, data } = await api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password }),
      });

      if (ok) {
        showMsg(msg, data.message + ' Redirecting…', 'ok');
        setTimeout(() => { window.location.href = data.redirectTo; }, 500);
      } else {
        showMsg(msg, data?.error || 'Login failed.', 'error');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
