<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dayflow — Management Dashboard</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="top">
    <span class="brand">Dayflow</span>
    <span class="tagline">Every workday, perfectly aligned.</span>
  </div>
  <main>
    <div class="card wide">
      <div class="status-line">
        <span class="spinner" id="statusLine">Checking session…</span>
      </div>
      <h1>Management Dashboard</h1>
      <p class="sub" id="welcomeText">This is a placeholder — future Dayflow modules (employee profiles, attendance, payroll, reports) will live here.</p>
      <div class="msg" id="msg"></div>
      <button type="button" class="secondary" id="logoutBtn">Logout</button>
    </div>
  </main>
  <script src="/api.js"></script>
  <script>
    const statusLine = document.getElementById('statusLine');
    const welcomeText = document.getElementById('welcomeText');
    const msg = document.getElementById('msg');

    (async () => {
      const { ok, data } = await api('/api/dashboard/admin', { method: 'GET' });
      if (ok) {
        statusLine.textContent = 'Signed in';
        welcomeText.textContent = data.message;
      } else {
        const me = await api('/api/auth/me', { method: 'GET' });
        if (!me.ok) {
          window.location.href = '/login.html';
        } else {
          showMsg(msg, 'Access denied: this account does not have Admin/HR access.', 'error');
          statusLine.textContent = 'Access denied';
        }
      }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
